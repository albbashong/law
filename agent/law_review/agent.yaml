name: 법령 근거 조회 에이전트
description: >
  건축·개발 인허가의 법령 근거를 찾는다 — 여기에 무엇을 지을 수 있는지(공장·단독주택·창고 등),
  건폐율·용적률, 근거 조문, 상위법·시행령·조례 위임 관계와 별표. 주소만 줘도 용도지역을 확인해
  근거를 찾는다. 지도 조작과 토지·건축물 대장 상세 조회는 이 에이전트가 아니다.
  건축 가능 여부를 단정하지 않는다 — 근거 조문과 조건, 남은 확인 사항을 제시한다.
version: "0.1.0"
provider:
  organization: 웨이버스
  url: "https://wavus.co.kr"
defaultInputModes:  ["text/plain"]
defaultOutputModes: ["text/plain", "application/json"]
skills:
  - id: law_basis
    name: 인허가 법령 근거 조회
    description: >
      용도지역별 건축 가능 건축물(국토계획법 시행령 별표·시군 도시계획 조례 별표), 건폐율·용적률,
      농지·산지 전용허가, 근거 조문 원문과 상위법·하위법·조례 위임 체인을 찾는다.
      주소, 시군구+용도지역, 또는 법령·조문 이름 중 무엇으로 물어도 된다. 허가 여부를 판정하지 않는다.
    tags: [법령, 조례, 인허가, 건축제한, 용도지역, 건폐율, 용적률, 근거조문, 별표]
    examples:
      - "경상북도 영천시 금호읍 신월리 1-51에 공장 지을 수 있어?"
      - "영천시 자연녹지지역 단독주택 건폐율이랑 근거 조문 알려줘"
      - "국토계획법 시행령 제84조가 영천시 조례에서는 어떻게 정해져 있어?"
      - "건축법 제11조 근거랑 관련 하위 법령 찾아줘"
    # 조회만 한다 — 아무것도 바꾸지 않는다. 그래서 다른 읽기와 병렬로 돈다.
    hints: { readOnly: true, destructive: false, idempotent: true }
