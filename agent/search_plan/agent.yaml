name: 검색 계획 에이전트
description: >
  법령 질문 하나를 받아, 답하려면 어떤 법령·조문을 어떤 순서로 열어야 하는지 검색 계획을 준다.
  계획은 법령 데이터의 인용·위임·조례 연계 연결에서 계산한다. 답은 쓰지 않고 조문 원문도 싣지 않는다.
version: "0.1.0"
provider:
  organization: 웨이버스
  url: "https://wavus.co.kr"
defaultInputModes:  ["text/plain"]
defaultOutputModes: ["application/json"]
skills:
  - id: search_plan
    name: 검색 계획
    description: >
      질문에 맞는 시작 조문을 검색 후보에서 고르고, 위임·상하위·조례·별표 연결을 따라 열어 볼 조문 단계와
      꼭 열 조문을 facts.검색_계획 으로 돌려준다. 질문에 필지 주소가 있으면 시군구를 확인해 조례까지 잇는다.
    tags: [법령, 검색, 조문, 위임, 조례]
    examples:
      - "자연녹지지역 건폐율 기준이 뭐야?"
      - "공직자가 받을 수 있는 선물 한도는?"
    hints: { readOnly: true, destructive: false, idempotent: true }
