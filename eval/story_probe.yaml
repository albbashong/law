# 쉬운 설명(이야기) 점검용 — 분야를 넓혀 "질문 → 예시로 설명" 대화가 정확한지 사람이 읽고 본다.
#   uv run -q --no-project --with pyyaml python eval/run_eval.py --golden eval/story_probe.yaml
# 채점은 형식(expect_prefix)만 자동이다. 정확도는 답을 읽고 판단한다.

- id: P01
  kind: story
  turns: ["농지에 창고 지으려면 농지전용허가 받아야 해?", "예를 들어 설명해줘"]
  expect_prefix: "예를 들어"

